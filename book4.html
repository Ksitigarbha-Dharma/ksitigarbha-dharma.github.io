p", "img/066/p04.webp", "img/066/p05.webp", "img/066/p06.webp", "img/066/p07.webp", "img/066/p08.webp", "img/066/p09.webp", "img/066/p10.webp", "img/066/p11.webp"], "next_dir": "img/067/", "next_img": "img/067/p01.webp"}, {"n": 67, "title": "六度（四）精進", "t1": "精進", "t2": "|六度（四）", "sutra": "具足精進，堅固勇猛，修諸善法。", "quote": "不怕慢，只怕站。", "q": ["不怕慢，只怕站。"], "by": "聖嚴法師", "think": "慢慢走的人，走得到。站著不動的人，永遠到不了。衝太快累倒的人，反而退步。", "act": ["今天問自己：", "□ 「我有沒有一件事，已經堅持了 5 年？」", "□ 「我有沒有一個習慣，從來沒斷過？」", "如果沒有——今天，開始一件「小到不能再小」的好事吧。"], "next_n": 68, "next_title": "六度（五）靜慮", "nt1": "靜慮", "nt2": "|六度（五）", "next_blurb": "禪定的進階版，跟「依止定」哪裡不一樣？", "series_next": "", "dir": "img/067/", "images": ["img/067/p01.webp", "img/067/p02.webp", "img/067/p03.webp", "img/067/p04.webp", "img/067/p05.webp", "img/067/p06.webp", "img/067/p07.webp", "img/067/p08.webp", "img/067/p09.webp", "img/067/p10.webp", "img/067/p11.webp"], "next_dir": "img/068/", "next_img": "img/068/p01.webp"}, {"n": 68, "title": "六度（五）靜慮", "t1": "靜慮", "t2": "|六度（五）", "sutra": "常樂勤修等持靜慮。", "quote": "沒有觀照的定，是死定；有觀照的定，是活定。", "q": ["沒有觀照的定，是死定；", "有觀照的定，是活定。"], "by": "聖嚴法師", "think": "定再久，沒有觀照，也只是「身體不動而已」，沒有智慧。", "act": ["今天打坐時，不只是「數呼吸」——還問自己：", "□ 「呼吸的是『誰』？」", "□ 「累的是『誰』？」", "有一個「看著的人」，一直都在。"], "next_n": 69, "next_title": "六度（六）般若", "nt1": "般若", "nt2": "|六度（六）", "next_blurb": "智慧的最高境界！般若，是讓你成佛的最後一把鑰匙……", "series_next": "", "dir": "img/068/", "images": ["img/068/p01.webp", "img/068/p02.webp", "img/068/p03.webp", "img/068/p04.webp", "img/068/p05.webp", "img/068/p06.webp", "img/068/p07.webp", "img/068/p08.webp", "img/068/p09.webp", "img/068/p10.webp", "img/068/p11.webp"], "next_dir": "img/069/", "next_img": "img/069/p01.webp"}, {"n": 69, "title": "六度（六）般若", "t1": "般若", "t2": "|六度（六）", "sutra": "應勤修習六到彼岸。", "quote": "不執著，就是般若。", "q": ["不執著，就是般若。"], "by": "聖嚴法師", "think": "「放下」，不是「不要」——還是吃飯，還是工作，還是愛人；只是心裡不抓。", "act": "做完任何一件好事，馬上忘掉它；做完任何一件難事，馬上放下它。心——會輕飄飄的。", "next_n": 70, "next_title": "有依行品終", "nt1": "|有依行品終", "nt2": "", "next_blurb": "15 篇的有依行課程結束，我們回顧
