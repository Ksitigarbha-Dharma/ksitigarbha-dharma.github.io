…", "quote": "真懺悔，是一場心的革命。", "q": ["真懺悔，是一場心的革命。"], "by": "聖嚴法師", "think": "道歉——三秒鐘。懺悔——一輩子的功課。", "act": ["今天試試看 4 步驟——找一件你做過的小錯事：", "□ 慚愧（心裡真的痛）", "□ 發露（寫下來）", "□ 求佛憐愍（念一句南無觀世音菩薩）", "□ 永不復作（從今天起不再做）"], "next_n": 74, "next_title": "懺悔種類", "nt1": "懺悔種類", "nt2": "", "next_blurb": "原來懺悔還分 3 種！事懺、理懺、無生懺……你做哪一種？", "series_next": "", "dir": "img/073/", "images": ["img/073/p01.webp", "img/073/p02.webp", "img/073/p03.webp", "img/073/p04.webp", "img/073/p05.webp", "img/073/p06.webp", "img/073/p07.webp", "img/073/p08.webp", "img/073/p09.webp", "img/073/p10.webp", "img/073/p11.webp"], "next_dir": "img/074/", "next_img": "img/074/p01.webp"}, {"n": 74, "title": "懺悔種類", "t1": "懺悔種類", "t2": "", "sutra": "於我法中，有二種人，名無所犯……", "quote": "懺悔，是修行人最謙卑的姿態，也是最強的力量。", "q": ["懺悔，", "是修行人最謙卑的姿態，", "也是最強的力量。"], "by": "聖嚴法師", "think": "不要怕「丟臉」——真正丟臉的，是「明明錯了還不認錯」。真正光榮的，是「跪下來承認」。", "act": "挑一個「最不想懺悔」的事——那個你心裡最深、最痛的點——跪下來（在心裡或實際）——一次徹底懺悔。", "next_n": 75, "next_title": "懺悔轉重為輕", "nt1": "懺悔|轉重為輕", "nt2": "", "next_blurb": "為什麼大罪可以變小罪？一個傳奇故事告訴你，懺悔的不可思議力量……", "series_next": "", "dir": "img/074/", "images": ["img/074/p01.webp", "img/074/p02.webp", "img/074/p03.webp", "img/074/p04.webp", "img/074/p05.webp", "img/074/p06.webp", "img/074/p07.webp", "img/074/p08.webp", "img/074/p09.webp", "img/074/p10.webp", "img/074/p11.webp"], "next_dir": "img/075/", "next_img": "img/075/p01.webp"}, {"n": 75, "title": "懺悔轉重為輕", "t1": "懺悔|轉重為輕", "t2": "", "sutra": "彼由如是慚愧懺悔，罪得除滅，永斷相續，不復更作。", "quote": "業力，像欠債；懺悔，像還債。", "q": ["業力，像欠債；", "懺悔，像還債。"], "by": "聖嚴法師", "think": "不還，一輩子被追；還了，一身輕鬆。", "act": "不要等死後才怕地獄——今天就懺悔。不要等下輩子才修——今天就改。", "next_n": 76, "next_title": "懺悔果報", "nt1": "懺悔果報", "nt2": "", "next_blurb": "真心懺悔後，你會得到什麼？5 大果報，會讓你驚訝！", "series_next": "", "dir": "img/075/", "images": ["img/075/p01.webp", "img/075/p02.webp", "img/075/p03.webp", "img/075/p04.webp", "img/075/p05.webp", "img/075/p06.webp", "img/075/p07.webp", "img/075/p08.webp", "img/075/p09.webp", "img/075/p10.webp", "img/075/p11.webp"], "next_dir": "img/076/", "next_img": "img/076/p01.webp"}, {"n": 76, "title": "懺悔果報", "t1": "懺悔果報", "t2": "", "sutra": "於彼眾中，有得下品忍者，有得中品忍者，有得上品忍者，有得世間第一法者，有得預流果者，有得一來果者，有得不還果者。", "quote": "懺悔，是「現世的天堂入場券」。", "q": ["懺悔，", "是「現世的天堂入場券」。"], "by": "聖嚴法師", "think": "天堂，不一定要等死後——真心懺悔的人，此刻就在天堂。", "act": "不要等大事再懺悔——從小事開始。跟一個你「沒道過歉」的人，道一個歉。", "next_n": 77, "next_title": "不懺悔過患", "nt1": "不懺悔|過患", "nt2": "", "next_blurb": "不懺悔，會發生什麼可怕的事？一個 90 歲老人的悔恨告訴你……", "series_next": "", "dir": "img/076/", "images": ["img/076/p01.webp", "img/076/p02.webp", "img/076/p03.webp", "img/076/p04.webp", "img/076/p05.webp", "img/076/p06.webp", "img/076/p07.webp", "img/076/p08.webp", "img/076/p09.webp", "img/076/p10.webp", "img/076/p11.webp"], "next_dir": "img/077/", "next_img": "img/077/p01.webp"}, {"n": 77, "title": "不懺悔過患", "t1": "不懺悔|過患", "t2": "", "sutra": "彼諸人眾俱時白佛……我等由是惡業障故，九十一劫流轉生死，常處地獄、傍生、餓鬼，瘖瘂無舌，都不能言，受諸苦毒，痛切難忍。", "quote": "最大的悲劇，不是做錯事——是做錯了還不懺悔。", "q": ["最大的悲劇，不是做錯事——", "是做錯了還不懺悔。"], "by": "聖嚴法師", "think": "做錯了，你有兩條路——哪個比較划算？不用算——一定是懺悔。", "act": ["今天，不要拖了——", "□ 拿出紙筆，寫下你心裡最深、最不想面對的事", "□ 寫完——跪下來，對佛菩薩說：「我錯了，我懺悔，從今天起我改。」"], "next_n": 78, "next_title": "懺悔品終", "nt1": "懺悔品終", "nt2": "", "next_blurb": "8 篇懺悔課程結束，一篇總結 + 預告新品——善業道品第六……", "series_next": "", "dir": "img/077/", "images": ["img/077/p01.webp", "img/077/p02.webp", "img/077/p03.webp", "img/077/p04.webp", "img/077/p05.webp", "img/077/p06.webp", "img/077/p07.webp", "img/077/p08.webp", "img/077/p09.webp", "img/077/p10.webp", "img/077/p11.webp"], "next_dir": "img/078/", "next_img": "img/078/p01.webp"}, {"n": 78, "title": "懺悔品終", "t1": "懺悔品終", "t2": "", "sutra": "於是，世尊隨其所樂，方便為說四聖諦法。", "quote": "懺悔，不是終點——是新人生的起點。", "q": ["懺悔，不是終點——", "是新人生的起點。"], "by": "聖嚴法師", "think": "不是「我很糟」，是「我可以變好」。不是「我罪重」，是「我願意改」。", "act": ["「懺悔完，重新出發」：", "□ 過去的，用懺悔放下", "□ 今天的，用善行種下", "□ 未來的，用智慧迎接"], "next_n": 79, "next_title": "什麼是十善業道", "nt1": "什麼是|十善業道", "nt2": "", "next_blurb": "接下來，10 條金光大道，帶你走向人天福報，一直到成佛", "series_next": "", "dir": "img/078/", "images": ["img/078/p01.webp", "img/078/p02.we
