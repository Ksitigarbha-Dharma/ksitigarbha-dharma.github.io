a": "若諸國王及諸大臣，不護我法，障礙剃髮被服袈裟出家人，由此因緣，國土荒亂，一切人民困苦無依。", "quote": "護正法，不一定要做大事——但要敢「發聲」。", "q": ["護正法，不一定要做大事——", "但要敢「發聲」。"], "by": "聖嚴法師", "think": "很多時候——我們看到佛法被攻擊，不敢說話。別人說「拜佛迷信」，我們不敢反駁。", "act": ["從今天起，你可以做 3 件「護法小事」：", "□ 看到佛經，認真讀，不隨便丟", "□ 看到出家人，合掌問訊，不嘲笑", "□ 聽到別人攻擊佛法，至少說一句：「我覺得不是這樣……」"], "next_n": 44, "next_title": "五逆罪", "nt1": "五逆罪", "nt2": "", "next_blurb": "什麼是「五逆罪」？為什麼這 5 種罪最重？", "series_next": "", "dir": "img/043/", "images": ["img/043/p01.webp", "img/043/p02.webp", "img/043/p03.webp", "img/043/p04.webp", "img/043/p05.webp", "img/043/p06.webp", "img/043/p07.webp", "img/043/p08.webp", "img/043/p09.webp", "img/043/p10.webp", "img/043/p11.webp"], "next_dir": "img/044/", "next_img": "img/044/p01.webp"}, {"n": 44, "title": "五逆罪", "t1": "五逆罪", "t2": "", "sutra": "具十惡業，造五無間，誹謗正法，毀呰賢聖，離諸善法，具諸惡法。", "quote": "五逆罪離我們很遠？——不一定。殺父殺母，不一定要刀子，用「冷漠」、「不孝」，也是慢慢殺。", "q": ["五逆罪離我們很遠？——不一定。", "殺父殺母，不一定要刀子，", "用「冷漠」、「不孝」，", "也是慢慢殺。"], "by": "聖嚴法師", "think": "這些——雖然不是「五逆」的字面意思，但——是「五逆的小版本」。做久了，也會變成「準五逆」。", "act": ["從今天起：", "□ 對父母好一點，一通電話也好", "□ 不嫉妒任何修行高的人", "□ 對寺廟、對僧團，多說好話，少說壞話"], "next_n": 45, "next_title": "謗法可怕果報", "nt1": "謗法|可怕果報", "nt2": "", "next_blurb": "比五逆更可怕的，是「謗法」——嘲笑佛法的果報", "series_next": "", "dir": "img/044/", "images": ["img/044/p01.webp", "img/044/p02.webp", "img/044/p03.webp", "img/044/p04.webp", "img/044/p05.webp", "img/044/p06.webp", "img/044/p07.webp", "img/044/p08.webp", "img/044/p09.webp", "img/044/p10.webp", "img/044/p11.webp"], "next_dir": "img/045/", "next_img": "img/045/p01.webp"}, {"n": 45, "title": "謗法可怕果報", "t1": "謗法|可怕果報", "t2": "", "sutra": "誹謗正法，毀呰賢聖，此罪極重，過於五逆。何以故？五逆但傷一身，謗法傷無量身。", "quote": "謗法不是只有壞人會做——善良的人，也常常不小心「謗法」。", "q": ["謗法不是只有壞人會做——", "善良的人，", "也常常不小心「謗法」。"], "by": "聖嚴法師", "think": "這些——都是「小型謗法」。不一定有惡意，但結果一樣——讓人遠離佛法。", "act": ["從今天起：", "□ 不知道，就說「我不太懂，我去問師父」", "□ 別人想學佛，鼓勵他，不要潑冷水", "□ 看到謗佛文章，不按讚、不分享、滑過"], "next_n": 46, "next_title": "殺生惡報", "nt1": "殺生惡報", "nt2": "", "next_blurb": "殺生會帶來什麼可怕的果報？為什麼我們要少殺生？", "series_next": "", "dir": "img/045/", " 最重要的是——把「家」放在心裡。想到老公、老婆、小孩，就會捨不得傷害他們。", "act": ["怎麼辦？——學會 3 個自保：", "□ 不看色情片", "□ 不亂搭、不亂搞", "□ 慾望升起時，立刻念「南無地藏菩薩」"], "next_n": 49, "next_title": "妄語惡報", "nt1": "妄語惡報", "nt2": "", "next_blurb": "說一個小謊，為什麼會帶來大災難？", "series_next": "", "dir": "img/048/", "images": ["img/048/p01.webp", "img/048/p02.webp", "img/048/p03.webp", "img/048/p04.webp", "img/048/p05.webp", "img/048/p06.webp", "img/048/p07.webp", "img/048/p08.webp", "img/048/p09.webp", "img/048/p10.webp", "img/048/p11.webp"], "next_dir": "img/049/", "next_img": "img/049/p01.webp"}, {"n": 49, "title": "妄語惡報", "t1": "妄語惡報", "t2": "", "sutra": "離虛誑語者，為一切眾生信任，言皆無謬，諸天人天所共敬愛，諸惡業障盡滅無餘。", "quote": "一個謊，要 10 個謊來圓；10 個謊，要 100 個謊。最後，你會被自己的謊言淹死。", "q": ["一個謊，要 10 個謊來圓；", "10 個謊，要 100 個謊。", "最後，你會被自己的謊言淹死。"], "by": "聖嚴法師", "think": "這些——都是「小謊」。不是大事，但日積月累——你的人會變「沒分量」。", "act": ["從今天起，試試 3 件事：", "□ 「我不能去」比「我不舒服」誠實", "□ 「我睡過頭，對不起」比「塞車」勇敢", "□ 「我還沒吃」讓媽媽幫你準備", "誠實，是一種「氣質」。"], "next_n": 50, "next_title": "兩舌惡報", "nt1": "兩舌惡報", "nt2": "", "next_blurb": "什麼是「兩舌」？為什麼挑撥離間比說謊還可怕？", "series_next": "", "dir": "img/049/", "images": ["img/049/p01.webp", "img/049/p02.webp", "img/049/p03.webp", "img/049/p04.webp", "img/049/p05.webp", "img/049/p06.webp", "img/049/p07.webp", "img/049/p08.webp", "img/049/p09.webp", "img/049/p10.webp", "img/049/p11.webp"], "next_dir": "img/050/", "next_img": "img/050/p01.webp"}, {"n": 50, "title": "兩舌惡報", "t1": "兩舌惡報", "t2": "", "sutra": "離離間語者，一切眷屬不能破壞，不能屈敗，諸惡業障盡滅無餘，解脫一切眾苦。", "quote": "想要人緣好，就學會 3 件事：聽到壞話——不傳；聽到挑撥——不接；看到誤會——化解。", "q": ["想要人緣好，就學會 3 件事：", "聽到壞話——不傳；", "聽到挑撥——不接；", "看到誤會——化解。"], "by": "聖嚴法師", "think": "從一個「不傳壞話」的人開始——你的人緣、福報、家庭，都會慢慢變好。", "act": ["從今天起，練 3 個習慣：", "□ 聽到壞話，「停在自己這裡」", "□ 把壞話「翻譯」成好話", "□ 化解誤會，當「和事佬」"], "next_n": 51, "next_title": "惡口惡報", "nt1": "惡口惡報", "nt2": "", "next_blurb": "罵髒話、講刻薄話，會帶來什麼後果？一張嘴影響多大？", "series_next": "", "dir": "img/050/", "images": ["img/050/p01.webp", "img/050/p02.webp", "img/050/p03.webp", "img/050/p04.webp", "img/050/p05.webp", "img/050/p06.webp", "img/050/p07.webp
