<script>window.BOOK={"no": 2, "cn": "二", "name": "十輪品", "total": 100, "from": 21, "to": 40, "cover": {"dir": "img/021/", "img": "img/021/p01.webp"}, "back": {"dir": "img/040/", "img": "img/040/p12.webp"}, "prev_book": {"no": 1, "cn": "一", "name": "序品第一", "n": 1}, "next_book": {"no": 3, "cn": "三", "name": "無依行品", "n": 41}, "posts": [{"n": 21, "title": "地藏自起白佛 · 進入十輪品", "t1": "地藏|自起白佛", "t2": "進入|十輪品", "sutra": "爾時，地藏菩薩摩訶薩從座而起，整理衣服，頂禮佛足，偏袒右肩，右膝著地，合掌恭敬而白佛言：我今問世尊，無量功德海，唯願賜開許……", "quote": "真正的問題，比答案更珍貴。", "q": ["真正的問題，", "比答案更珍貴。"], "by": "聖嚴法師", "think": "地藏菩薩問的：「為什麼這個世界這麼亂？」其實也是我們每個人心裡的問題。問出來，才能找到答案。", "act": "試著對佛菩薩（或對自己的心）問一個你心裡放了很久的問題。問了之後，答案不一定立刻來，但會慢慢浮現。", "next_n": 22, "next_title": "什麼是『十輪』？", "nt1": "什麼是|『十輪』？", "nt2": "", "next_blurb": "佛陀親口告訴地藏菩薩，「十輪」就是「十種佛輪」，是如來用本願力成就的，能調伏五濁惡世的眾生……", "series_next": "", "dir": "img/021/", "images": ["img/021/p01.webp", "img/021/p02.webp", "img/021/p03.webp", "img/021/p04.webp", "img/021/p05.webp", "img/021/p06.webp", "img/021/p07.webp", "img/021/p08.webp", "img/021/p09.webp", "img/021/p10.webp", "img/021/p11.webp"], "next_dir": "img/022/", "next_img": "img/022/p01.webp"}, {"n": 22, "title": "什麼是『十輪』？", "t1": "什麼是|『十輪』？", "t2": "", "sutra": "爾時，佛告地藏菩薩摩訶薩言：善男子，如來由本願力，成就十種佛輪。居此佛土五濁惡世一切有情，退沒一切白淨善法，匱乏所有七聖財寶……", "quote": "最壞的時代，才看得出菩薩的偉大。", "q": ["最壞的時代，", "才看得出菩薩的偉大。"], "by": "聖嚴法師", "think": "佛陀不是只在好時代出來救眾生。在五濁惡世，在最亂、最壞、最難救的時代，才看得出他的力量。", "act": "想想看，你的人生中，有沒有遇過「最壞的時候」？那一刻，是不是反而看到了「最深的慈悲」？", "next_n": 23, "next_title": "如來第一佛輪 · 摧伏外道", "nt1": "如來|第一佛輪", "nt2": "摧伏外道", "next_blurb": "佛陀說：「我有第一佛輪，能摧伏一切外道邪論，讓眾生明白真理！」", "series_next": "", "dir": "img/022/", "images": ["img/022/p01.webp", "img/022/p02.webp", "img/022/p03.webp", "img/022/p04.webp", "img/022/p05.webp", "img/022/p06.webp", "img/022/p07.webp", "img/022/p08.webp", "img/022/p09.webp", "img/022/p10.webp", "img/022/p11.webp"], "next_dir": "img/023/", "next_img": "img/023/p01.webp"}, {"n": 23, "title": "如來第一佛輪 · 摧伏外道", "t1": "如來|第一佛輪", "t2": "摧伏外道", "sutra": "善男子！云何如來第一佛輪？善男子！譬如剎帝利種，灌頂大王，初登王位，七日之中，自稱我是剎帝利種灌頂大王，廣設珍奇上味飲食……", "quote": "真正的智慧，不怕被質疑——越質疑，越清楚。", "q": ["真正的智慧，不怕被質疑——", "越質疑，越清楚。"], "by": "聖嚴法師", "think": "佛陀的第一佛輪，不是用「壓迫」讓人信，是用「真理」讓人服。當你聽到一個道理，怎麼想都對——那就是佛輪在你心裡轉動。", "act": "對你聽到的一切資訊（新聞、影片、流言），多問一句：「這是真的嗎？經得起問嗎？」", "next_n": 24, "next_title": "第二佛輪 · 調伏剛強眾生", "nt1": "第二佛輪", "nt2": "調伏|剛強眾生", "next_blurb": "佛陀的第二佛輪，專門對付那些「最難救」的剛強眾生——怎麼樣的剛強？怎麼調伏？", "series_next": "", "dir": "img/023/", "images": ["img/023/p01.webp", "img/023/p02.webp", "img/023/p03.webp", "img/023/p04.webp", "img/023/p05.webp", "img/023/p06.webp", "img/023/p07.webp", "img/023/p08.webp", "img/023/p09.webp", "img/023/p10.webp", "img/023/p11.webp"], "next_dir": "img/024/", "next_img": "img/024/p01.webp"}, {"n": 24, "title": "第二佛輪 · 調伏剛強眾生", "t1": "第二佛輪", "t2": "調伏|剛強眾生", "sutra": "善男子！云何如來第二佛輪？善男子！譬如剎帝利種，灌頂大王，統四洲已，諸有怨敵欲為侵嬈，起四種兵……", "quote": "最難救的人，往往是最需要救的人。", "q": ["最難救的人，", "往往是最需要救的人。"], "by": "聖嚴法師", "think": "那些「剛強」的人，表面強硬，心裡其實最害怕、最孤獨。佛陀的四種兵，不是用來「打敗」他們，是用來「打開」他們。", "act": "對你身邊那個「最難搞」的人，不要急著放棄。用一點大悲、一點智慧、一點善巧、一點堅持——慢慢來，他會變的。", "next_n": 25, "next_title": "第三佛輪 · 利益三惡道", "nt1": "第三佛輪", "nt2": "利益|三惡道", "next_blurb": "佛陀的第三佛輪，能幫助地獄、餓鬼、畜生這三種苦難眾生，連他們都能受益！", "series_next": "", "dir": "img/024/", "images": ["img/024/p01.webp", "img/024/p02.webp", "img/024/p03.webp", "img/024/p04.webp", "img/024/p05.webp", "img/024/p06.webp", "img/024/p07.webp", "img/024/p08.webp", "img/024/p09.webp", "img/024/p10.webp", "img/024/p11.webp"], "next_dir": "img/025/", "next_img": "img/025/p01.webp"}, {"n": 25, "title": "第三佛輪 · 利益三惡道", "t1": "第三佛輪", "t2": "利益|三惡道", "sutra": "善男子！云何如來第三佛輪？善男子！譬如剎帝利種，灌頂大王，善能化導，國土所有諸惡人輩——種種惡業傷害國法，王悉除滅……", "quote": "沒有救不了的人——只有我們不夠耐心。", "q": ["沒有救不了的人——", "只有我們不夠耐心。"], "by": "聖嚴法師", "think": "連地獄、餓鬼、畜生都能受益——佛陀的慈悲，沒有「太晚」，沒有「無救」。只要還有一線，佛和地藏都會去拉。", "act": "對你身邊那個你覺得「無可救藥」的人，不要放棄。佛陀都不放棄地獄眾生，我們有什麼理由放棄活著的人？", "next_n": 26, "next_title": "第四佛輪 · 教化邊地", "nt1": "第四佛輪", "nt2": "教化邊地", "next_blurb": "佛陀的第四佛輪，能照到最偏遠、最沒有佛法的「邊地」——那些連寺廟都沒有的地方……", "series_next": "", "dir": "img/025/", "images": ["img/025/p01.webp", "img/025/p02.webp", "img/025/p03.webp", "img/025/p04.webp", "img/025/p05.webp", "img/025/p06.webp", "img/025/p07.webp", "img/025/p08.webp", "img/025/p09.webp", "img/025/p10.webp", "img/025/p11.webp"], "next_dir": "img/026/", "next_img": "img/026/p01.webp"}, {"n": 26, "title": "第四佛輪 · 教化邊地", "t1": "第四佛輪", "t2": "教化邊地", "sutra": "善男子！云何如來第四佛輪？善男子！譬如剎帝利種，灌頂大王，有諸邊邑及遠國土，種種惡業諸惡眾生，為其王者廣設方便，善能化導……", "quote": "佛法的光，沒有照不到的地方——只有不願睜眼的人。", "q": ["佛法的光，", "沒有照不到的地方——", "只有不願睜眼的人。"], "by": "聖嚴法師", "think": "邊地，不是地圖上才有的——任何一個「還沒接觸佛法的心」，都是邊地。", "act": "如果你身邊有人「從來不信佛」，不要強拉他，不要急。用你的善良、你的溫柔，慢慢感染他。那，就是你身上的「第四佛輪」在轉。", "next_n": 27, "next_title": "第五佛輪 · 轉惡為善", "nt1": "第五佛輪", "nt2": "轉惡為善", "next_blurb": "佛陀的第五佛輪，能把壞人變好人——那些做盡壞事的人，怎麼樣回頭？", "series_next": "", "dir": "img/026/", "images": ["img/026/p01.webp", "img/026/p02.webp", "img/026/p03.webp", "img/026/p04.webp", "img/026/p05.webp", "img/026/p06.webp", "img/026/p07.webp", "img/026/p08.webp", "img/026/p09.webp", "img/026/p10.webp", "img/026/p11.webp"], "next_dir": "img/027/", "next_img": "img/027/p01.webp"}, {"n": 27, "title": "第五佛輪 · 轉惡為善", "t1": "第五佛輪", "t2": "轉惡為善", "sutra": "善男子！云何如來第五佛輪？善男子！譬如剎帝利種，灌頂大王，國中之內所有諸惡——殺、盜、邪行、虛誑、離間、粗惡、雜穢之語，貪、瞋……", "quote": "沒有壞人，只有迷路的人。", "q": ["沒有壞人，", "只有迷路的人。"], "by": "聖嚴法師", "think": "佛陀的第五佛輪，看世界沒有「絕對的壞」——只有「還沒醒過來的善」。每個壞人心裡，都有一顆等待被喚醒的善種子。", "act": "對你身邊那個你討厭的人，試著看「他內心那顆善種子」。看見了，你就不會討厭他了——你會想幫他，把它喚醒。", "next_n": 28, "next_title": "第六佛輪 · 成熟善根", "nt1": "第六佛輪", "nt2": "成熟善根", "next_blurb": "佛陀的第六佛輪，能讓眾生的「善根」慢慢長大、成熟，從一棵小芽變成大樹……", "series_next": "", "dir": "img/027/", "images": ["img/027/p01.webp", "img/027/p02.webp", "img/027/p03.webp", "img/027/p04.webp", "img/027/p05.webp", "img/027/p06.webp", "img/027/p07.webp", "img/027/p08.webp", "img/027/p09.webp", "img/027/p10.webp", "img/027/p11.webp"], "next_dir": "img/028/", "next_img": "img/028/p01.webp"}, {"n": 28, "title": "第六佛輪 · 成熟善根", "t1": "第六佛輪", "t2": "成熟善根", "sutra": "善男子！云何如來第六佛輪？善男子！譬如剎帝利種，灌頂大王，國中所有善人賢者——持戒、修慧、好施、和柔，王皆攝受，廣設方便……", "quote": "不要急著成熟——只要每天澆一點水。", "q": ["不要急著成熟——", "只要每天澆一點水。"], "by": "聖嚴法師", "think": "善根的成熟，不是一夜長成的。每天讀一句佛經、念一聲聖號、做一個小善行——那就是「每天澆水」。", "act": "給你心裡的善根澆一次水：做一件昨天還沒做的小善事——幫人扶門、給陌生人一個微笑、線上正向留言。", "next_n": 29, "next_title": "第七佛輪 · 除諸煩惱", "nt1": "第七佛輪", "nt2": "除諸煩惱", "next_blurb": "佛陀的第七佛輪，能把心裡的煩惱——貪瞋癡慢疑——一個一個清掉！", "series_next": "", "dir": "img/028/", "images": ["img/028/p01.webp", "img/028/p02.webp", "img/028/p03.webp", "img/028/p04.webp", "img/028/p05.webp", "img/028/p06.webp", "img/028/p07.webp", "img/028/p08.webp", "img/028/p09.webp", "img/028/p10.webp", "img/028/p11.webp"], "next_dir": "img/029/", "next_img": "img/029/p01.webp"}, {"n": 29, "title": "第七佛輪 · 除諸煩惱", "t1": "第七佛輪", "t2": "除諸煩惱", "sutra": "善男子！云何如來第七佛輪？善男子！譬如剎帝利種，灌頂大王，國中之內若有怨家——種種惡賊侵嬈人民，王皆攝伏，令其退散，國土安隱……", "quote": "煩惱不是你的敵人——是你的老師。", "q": ["煩惱不是你的敵人——", "是你的老師。"], "by": "聖嚴法師", "think": "每一個煩惱出現，都在告訴你：「你執著了什麼？你害怕什麼？你還沒看清什麼？」看見了，煩惱就轉成智慧。", "act": "觀察今天升起的一個煩惱（生氣、煩躁、貪心、嫉妒……）。不要趕走它，只是看著它，問自己：「它想告訴我什麼？」", "next_n": 30, "next_title": "第八佛輪 · 授戒持戒", "nt1": "第八佛輪", "nt2": "授戒持戒", "next_blurb": "佛陀的第八佛輪，用戒律幫助眾生——戒律不是束縛，是保護！", "series_next": "", "dir": "img/029/", "images": ["img/029/p01.webp", "img/029/p02.webp", "img/029/p03.webp", "img/029/p04.webp", "img/029/p05.webp", "img/029/p06.webp", "img/029/p07.webp", "img/029/p08.webp", "img/029/p09.webp", "img/029/p10.webp", "img/029/p11.webp"], "next_dir": "img/030/", "next_img": "img/030/p01.webp"}, {"n": 30, "title": "第八佛輪 · 授戒持戒", "t1": "第八佛輪", "t2": "授戒持戒", "sutra": "善男子！云何如來第八佛輪？善男子！譬如剎帝利種，灌頂大王，制定法度，嚴整國綱，令一切人皆守王法，國土安寧，民得安樂……", "quote": "持戒，不是讓你變死板——是讓你變自由。", "q": ["持戒，不是讓你變死板——", "是讓你變自由。"], "by": "聖嚴法師", "think": "很多人以為持戒會綁住自己，其實，不持戒的人，才是被自己的習氣綁得最緊的人。", "act": "試著為自己持一條小戒：「今天我不批評任何人。」或者——「今天我不吃肉一餐。」持了，你會發現——那一天，你比平常更自由、更輕鬆。", "next_n": 31, "next_title": "第九佛輪 · 親近善知識", "nt1": "第九佛輪", "nt2": "親近|善知識", "next_blurb": "佛陀的第九佛輪，教我們找到對的老師——善知識是修行最重要的助緣……", "series_next": "", "dir": "img/030/", "images": ["img/030/p01.webp", "img/030/p02.webp", "img/030/p03.webp", "img/030/p04.webp", "img/030/p05.webp", "img/030/p06.webp", "img/030/p07.webp", "img/030/p08.webp", "img/030/p09.webp", "img/030/p10.webp", "img/030/p11.webp"], "next_dir": "img/031/", "next_img": "img/031/p01.webp"}, {"n": 31, "title": "第九佛輪 · 親近善知識", "t1": "第九佛輪", "t2": "親近|善知識", "sutra": "善男子，我成如是第九佛輪。由此輪故，利益安樂無量有情，得安隱住，得無驚恐，得無所畏。", "quote": "修行路上，一個人走得快，一群人走得遠。", "q": ["修行路上，一個人走得快，", "一群人走得遠。"], "by": "聖嚴法師", "think": "我們常以為——自己看 YouTube、自己看書，就能學好佛法。但其實——沒有老師指點，我們很容易「自以為懂了」。", "act": ["今天，想想你身邊有沒有這樣的人？", "□ 一個常常提醒你「不要生氣」的長輩", "□ 一個帶你念佛、共修的師兄", "□ 一個讓你看完心就靜下來的師父", "如果有，好好珍惜。如果沒有，開始尋找。"], "next_n": 32, "next_title": "第十佛輪 · 成就涅槃", "nt1": "第十佛輪", "nt2": "成就涅槃", "next_blurb": "佛陀講完最後一個佛輪——走向涅槃的圓滿之路", "series_next": "", "dir": "img/031/", "images": ["img/031/p01.webp", "img/031/p02.webp", "img/031/p03.webp", "img/031/p04.webp", "img/031/p05.webp", "img/031/p06.webp", "img/031/p07.webp", "img/031/p08.webp", "img/031/p09.webp", "img/031/p10.webp", "img/031/p11.webp"], "next_dir": "img/032/", "next_img": "img/032/p01.webp"}, {"n": 32, "title": "第十佛輪 · 成就涅槃", "t1": "第十佛輪", "t2": "成就涅槃", "sutra": "善男子，我成如是第十佛輪。由此輪故，如實了知自身、他身，諸漏永盡，利益安樂無量有情。", "quote": "涅槃，不在山頂上，在你的每一個當下。", "q": ["涅槃，不在山頂上，", "在你的每一個當下。"], "by": "聖嚴法師", "think": "我們以為涅槃要等到 80 歲、要等到「修很久」才能到。其實——涅槃，是「現在這一刻就能體驗的」。", "act": ["今天試試——", "□ 有人惹你生氣？深呼吸，不回應，那就是「涅槃一秒鐘」", "□ 有人讚美你？微笑，不得意，那也是「涅槃一秒鐘」", "原來涅槃，一直都在。"], "next_n": 33, "next_title": "剎帝利轉輪聖王十輪", "nt1": "剎帝利|轉輪聖王|十輪", "nt2": "", "next_blurb": "講完佛輪，接著佛陀講「剎帝利轉輪聖王」也有十輪……", "series_next": "", "dir": "img/032/", "images": ["img/032/p01.webp", "img/032/p02.webp", "img/032/p03.webp", "img/032/p04.webp", "img/032/p05.webp", "img/032/p06.webp", "img/032/p07.webp", "img/032/p08.webp", "img/032/p09.webp", "img/032/p10.webp", "img/032/p11.webp"], "next_dir": "img/033/", "next_img": "img/033/p01.webp"}, {"n": 33, "title": "剎帝利轉輪聖王十輪", "t1": "剎帝利|轉輪聖王|十輪", "t2": "", "sutra": "善男子，剎帝利種灌頂大王成就如是第九王輪。由此輪故，令自國土增長安樂，能伏一切怨敵惡友。", "quote": "在家是父母，在公司是主管，你都是「小國王」。", "q": ["在家是父母，在公司是主管，", "你都是「小國王」。"], "by": "聖嚴法師", "think": "我們以為「王十輪」是給總統看的。其實——每個人都是自己生活的「國王」。", "act": ["那——你有做到嗎？", "□ 不貪不騙", "□ 為孩子、下屬好，不只為自己", "□ 每天反省自己", "如果做到，你就是「現代的轉輪聖王」。"], "next_n": 34, "next_title": "剎帝利栴荼羅可怕", "nt1": "剎帝利|栴荼羅|可怕", "nt2": "", "next_blurb": "如果國王是「壞國王」，會發生什麼可怕的事？", "series_next": "", "dir": "img/033/", "images": ["img/033/p01.webp", "img/033/p02.webp", "img/033/p03.webp", "img/033/p04.webp", "img/033/p05.webp", "img/033/p06.webp", "img/033/p07.webp", "img/033/p08.webp", "img/033/p09.webp", "img/033/p10.webp", "img/033/p11.webp"], "next_dir": "img/034/", "next_img": "img/034/p01.webp"}, {"n": 34, "title": "剎帝利栴荼羅可怕", "t1": "剎帝利|栴荼羅|可怕", "t2": "", "sutra": "諸有國王，起惡邪見，不護三寶，損惱賢聖，是名剎帝利栴荼羅。", "quote": "權力，是試金石。給好人，變成菩薩；給壞人，變成魔王。", "q": ["權力，是試金石。", "給好人，變成菩薩；", "給壞人，變成魔王。"], "by": "聖嚴法師", "think": "我們不是國王，但我們都有「小權力」——權力越大，責任越大。", "act": ["問問自己：", "□ 我有沒有用權力欺負人？", "□ 我有沒有不聽勸告？", "□ 我有沒有看不起別人？", "趕快改——不要等到災難來敲門。"], "next_n": 35, "next_title": "護持三寶剎帝利轉輪聖王", "nt1": "護持三寶|剎帝利|轉輪聖王", "nt2": "", "next_blurb": "什麼樣的國王，才是「護持三寶」的真正聖王？", "series_next": "", "dir": "img/034/", "images": ["img/034/p01.webp", "img/034/p02.webp", "img/034/p03.webp", "img/034/p04.webp", "img/034/p05.webp", "img/034/p06.webp", "img/034/p07.webp", "img/034/p08.webp", "img/034/p09.webp", "img/034/p10.webp", "img/034/p11.webp"], "next_dir": "img/035/", "next_img": "img/035/p01.webp"}, {"n": 35, "title": "護持三寶剎帝利轉輪聖王", "t1": "護持三寶|剎帝利|轉輪聖王", "t2": "", "sutra": "若諸國王，護持三寶，恭敬出家人，此王當得無量功德，國土增長，一切人民安樂。", "quote": "護持三寶，不是有錢人的事——是每個人的事。", "q": ["護持三寶，不是有錢人的事——", "是每個人的事。"], "by": "聖嚴法師", "think": "不一定要當國王，也不一定要有錢，才能護持三寶。", "act": ["你——也可以做這 3 件小事：", "□ 護持佛寶——家裡放一尊佛像，每天早晚看一眼", "□ 護持法寶——家裡放一本佛經，每天讀一段", "□ 護持僧寶——看到出家人，合掌問訊"], "next_n": 36, "next_title": "出家人勝義", "nt1": "出家人|勝義", "nt2": "", "next_blurb": "為什麼出家這麼了不起？出家人到底有什麼特別？", "series_next": "", "dir": "img/035/", "images": ["img/035/p01.webp", "img/035/p02.webp", "img/035/p03.webp", "img/035/p04.webp", "img/035/p05.webp", "img/035/p06.webp", "img/035/p07.webp", "img/035/p08.webp", "img/035/p09.webp", "img/035/p10.webp", "img/035/p11.webp"], "next_dir": "img/036/", "next_img": "img/036/p01.webp"}, {"n": 36, "title": "出家人勝義", "t1": "出家人|勝義", "t2": "", "sutra": "我法中出家，乃至剃除鬚髮被片袈裟。若持戒、若破戒、下至無戒，一切天人應供養。", "quote": "出家人不一定比你聰明，不一定比你富有——但他們選了一條「放下」的路，這條路，比你選的難 100 倍。", "q": ["出家人不一定比你聰明，", "不一定比你富有——", "但他們選了一條「放下」的路，", "這條路，比你選的難 100 倍。"], "by": "聖嚴法師", "think": "他們不是不懂，是「跨過去了」。就像爬過山的人，看山看得最清楚。", "act": "如果你看到一個出家人，不管男女，不管老少，不管你認識不認識——請合掌，道一聲「阿彌陀佛」。", "next_n": 37, "next_title": "袈裟功德", "nt1": "袈裟功德", "nt2": "", "next_blurb": "袈裟有什麼神奇的力量？為什麼連天神都恭敬？", "series_next": "", "dir": "img/036/", "images": ["img/036/p01.webp", "img/036/p02.webp", "img/036/p03.webp", "img/036/p04.webp", "img/036/p05.webp", "img/036/p06.webp", "img/036/p07.webp", "img/036/p08.webp", "img/036/p09.webp", "img/036/p10.webp", "img/036/p11.webp"], "next_dir": "img/037/", "next_img": "img/037/p01.webp"}, {"n": 37, "title": "袈裟功德", "t1": "袈裟功德", "t2": "", "sutra": "見袈裟一相，知是慈悲本。袈裟者，諸佛法幢相，一切天人應恭敬。", "quote": "不要小看任何宗教的衣服——它背後，是千百年的修行人留下的氣息。", "q": ["不要小看任何宗教的衣服——", "它背後，是千百年的", "修行人留下的氣息。"], "by": "聖嚴法師", "think": "那不是布，是「佛的衣服」。", "act": ["我們不一定能穿袈裟——但我們可以做這 3 件事：", "□ 看到袈裟，合掌", "□ 不要踩、不要踢、不要丟袈裟", "□ 自己的「心」也要像袈裟一樣", "從今天起——把你的心，變成一片袈裟吧。"], "next_n": 38, "next_title": "不應毀辱出家人", "nt1": "不應毀辱|出家人", "nt2": "", "next_blurb": "如果有人羞辱、傷害出家人，會發生什麼可怕的事？", "series_next": "", "dir": "img/037/", "images": ["img/037/p01.webp", "img/037/p02.webp", "img/037/p03.webp", "img/037/p04.webp", "img/037/p05.webp", "img/037/p06.webp", "img/037/p07.webp", "img/037/p08.webp", "img/037/p09.webp", "img/037/p10.webp", "img/037/p11.webp"], "next_dir": "img/038/", "next_img": "img/038/p01.webp"}, {"n": 38, "title": "不應毀辱出家人", "t1": "不應毀辱|出家人", "t2": "", "sutra": "若有惱亂剃除鬚髮被服袈裟出家人者，即為惱亂過去未來現在諸佛，退失善根，墮諸惡趣。", "quote": "你看不起的那個出家人，可能是你前世的師父。", "q": ["你看不起的那個出家人，", "可能是你前世的師父。"], "by": "聖嚴法師", "think": "那位胖師父，可能 30 年沒生氣。那位年輕師父，可能已經苦修 10 年。那位穿舊衣的師父，可能把錢都捐了。", "act": "看到任何出家人，心裡默念：「我不認識您，但我尊敬您願意走這條路。」", "next_n": 39, "next_title": "護法善神勝鬘等事例", "nt1": "護法善神|勝鬘等|事例", "nt2": "", "next_blurb": "原來，有很多看不見的「天神」，都在保護出家人", "series_next": "", "dir": "img/038/", "images": ["img/038/p01.webp", "img/038/p02.webp", "img/038/p03.webp", "img/038/p04.webp", "img/038/p05.webp", "img/038/p06.webp", "img/038/p07.webp", "img/038/p08.webp", "img/038/p09.webp", "img/038/p10.webp", "img/038/p11.webp"], "next_dir": "img/039/", "next_img": "img/039/p01.webp"}, {"n": 39, "title": "護法善神勝鬘等事例", "t1": "護法善神|勝鬘等|事例", "t2": "", "sutra": "下至無戒剃除鬚髮被袈裟者，普善守護，恭敬供養，常護持僧伽藍舍。", "quote": "你以為你一個人在念佛，其實天上有無量的眼睛在看你。", "q": ["你以為你一個人在念佛，", "其實天上有無量的眼睛在看你。"], "by": "聖嚴法師", "think": "你念一句「南無阿彌陀佛」，天上的天神就聽到了。你拜一次佛，護法善神就記下一筆功德。", "act": ["今天試試：", "□ 早上起來，默念一句「南無觀世音菩薩」", "□ 中午吃飯前，合掌感謝", "□ 晚上睡前，念三聲「阿彌陀佛」"], "next_n": 40, "next_title": "十輪品終", "nt1": "十輪品終", "nt2": "", "next_blurb": "十輪品的最後一篇——大眾的反應，大地震動，法雨灑下", "series_next": "", "dir": "img/039/", "images": ["img/039/p01.webp", "img/039/p02.webp", "img/039/p03.webp", "img/039/p04.webp", "img/039/p05.webp", "img/039/p06.webp", "img/039/p07.webp", "img/039/p08.webp", "img/039/p09.webp", "img/039/p10.webp", "img/039/p11.webp"], "next_dir": "img/040/", "next_img": "img/040/p01.webp"}, {"n": 40, "title": "十輪品終", "t1": "十輪品終", "t2": "", "sutra": "聞說如是十種佛輪，於眾會中，有八十四百千那庾多菩薩摩訶薩得無生法忍；復有無量菩薩摩訶薩獲得種種諸陀羅尼、三摩地忍……", "quote": "真理，不會自己跑來；是你準備好了，它才出現。", "q": ["真理，不會自己跑來；", "是你準備好了，它才出現。"], "by": "聖嚴法師", "think": "不要羨慕菩薩——他們也是從「一念信」開始的。", "act": ["從今天起，你可以做 3 件小事，開始累積「悟道的種子」：", "□ 每天讀一段佛經（5 分鐘就好）", "□ 每天念一聲佛號（在等紅綠燈時就可以）", "□ 每天做一件小善事（讓座、撿垃圾、幫人開門）"], "next_n": 41, "next_title": "什麼是無依行？", "nt1": "什麼是|無依行？", "nt2": "", "next_blurb": "無依行品第三開講——末法眾生最大的問題：沒有歸依", "series_next": "", "dir": "img/040/", "images": ["img/040/p01.webp", "img/040/p02.webp", "img/040/p03.webp", "img/040/p04.webp", "img/040/p05.webp", "img/040/p06.webp", "img/040/p07.webp", "img/040/p08.webp", "img/040/p09.webp", "img/040/p10.webp", "img/040/p11.webp"], "next_dir": "img/041/", "next_img": "img/041/p01.webp", "go": {"no": 3, "cn": "三", "name": "無依行品", "n": 41}}]};</script>
