<script>window.BOOK={"no": 1, "cn": "一", "name": "序品第一", "total": 100, "from": 1, "to": 20, "cover": {"dir": "img/001/", "img": "img/001/p01.webp"}, "back": {"dir": "img/020/", "img": "img/020/p12.webp"}, "prev_book": null, "next_book": {"no": 2, "cn": "二", "name": "十輪品", "n": 21}, "posts": [{"n": 1, "title": "神祕的山", "t1": "神祕的山", "t2": "", "sutra": "如是我聞：一時，薄伽梵在佉羅帝耶山，諸牟尼仙所依住處。", "quote": "好的事情，都是慢慢來的。", "q": ["好的事情，", "都是慢慢來的。"], "by": "聖嚴法師", "think": "想想看，佛陀為什麼不一開始就直接介紹地藏菩薩？而是先讓大家等待、靜下心、感受異象？因為——重要的事，值得我們鄭重對待。", "act": "不要急著滑下一個影片。給自己一分鐘，深呼吸三次。那三次呼吸，就是您今天的「佉羅帝耶山」。", "next_n": 2, "next_title": "香雨花雨從南方來", "nt1": "香雨花雨|從南方來", "nt2": "", "next_blurb": "從南方天空，飄來一團淡金色的雲，然後下起香雨、花雨、寶物雨、衣服雨。而從南方天空，緩緩走來了一位戴寶冠的菩薩……", "series_next": "", "dir": "img/001/", "images": ["img/001/p01.webp", "img/001/p02.webp", "img/001/p03.webp", "img/001/p04.webp", "img/001/p05.webp", "img/001/p06.webp", "img/001/p07.webp", "img/001/p08.webp", "img/001/p09.webp", "img/001/p10.webp", "img/001/p11.webp"], "next_dir": "img/002/", "next_img": "img/002/p01.webp"}, {"n": 2, "title": "香雨花雨從南方來", "t1": "香雨花雨|從南方來", "t2": "", "sutra": "於是南方大香雲來、大花雲來、大妙殊麗寶飾雲來、大妙鮮潔衣服雲來。雨大香雨、雨大花雨、雨大妙殊麗寶飾雨、雨大妙鮮潔衣服雨。", "quote": "好事到來之前，天地會先有徵兆。", "q": ["好事到來之前，", "天地會先有徵兆。"], "by": "聖嚴法師", "think": "四種雲雨，不是巧合。是宇宙在告訴大家：一位大菩薩，即將到來。", "act": "安靜下來感受一下身邊有沒有什麼「巧合」，也許那就是你的「香雨花雨」。", "next_n": 3, "next_title": "大眾掌心的如意珠", "nt1": "大眾掌心的|如意珠", "nt2": "", "next_blurb": "就在四種雨下完後，大眾發現自己兩手掌心，竟然出現了會發光的如意珠……", "series_next": "", "dir": "img/002/", "images": ["img/002/p01.webp", "img/002/p02.webp", "img/002/p03.webp", "img/002/p04.webp", "img/002/p05.webp", "img/002/p06.webp", "img/002/p07.webp", "img/002/p08.webp", "img/002/p09.webp", "img/002/p10.webp", "img/002/p11.webp"], "next_dir": "img/003/", "next_img": "img/003/p01.webp"}, {"n": 3, "title": "大眾掌心的如意珠", "t1": "大眾掌心的|如意珠", "t2": "", "sutra": "爾時，一切諸來大眾，鹹見如是種種雲雨，亦聞如是諸法音聲，隨意所樂，各見其身種種香花、寶飾、衣服之所莊嚴。", "quote": "真正的禮物，都是先讓你受感動，然後才送到。", "q": ["真正的禮物，", "都是先讓你受感動，", "然後才送到。"], "by": "聖嚴法師", "think": "香花、寶飾、衣服、如意珠——每個人收到的，都剛好是自己最想要的。這不是巧合，是慈悲的力量，在了解我們的心。", "act": "留意一下，生活中是不是也有「剛好你需要」的禮物？那不是運氣，是慈悲。", "next_n": 4, "next_title": "天帝釋無垢生的提問", "nt1": "天帝釋無垢生|的提問", "nt2": "", "next_blurb": "一位戴著光明天冠的天神，從座位起身，合掌恭敬地問佛陀：「世尊，為什麼會出現這麼神奇的徵兆？」", "series_next": "", "dir": "img/003/", "images": ["img/003/p01.webp", "img/003/p02.webp", "img/003/p03.webp", "img/003/p04.webp", "img/003/p05.webp", "img/003/p06.webp", "img/003/p07.webp", "img/003/p08.webp", "img/003/p09.webp", "img/003/p10.webp", "img/003/p11.webp"], "next_dir": "img/004/", "next_img": "img/004/p01.webp"}, {"n": 4, "title": "天帝釋無垢生的提問", "t1": "天帝釋無垢生|的提問", "t2": "", "sutra": "於眾會中，有天帝釋名無垢生，去薄伽梵不遠而坐，即從座起，頂禮世尊合掌向佛，以頌問曰……", "quote": "不懂就問，不是丟臉；不問才丟臉。", "q": ["不懂就問，不是丟臉；", "不問才丟臉。"], "by": "聖嚴法師", "think": "無垢生天帝釋是天神中的領袖，卻仍然謙虛地請教佛陀。他不怕被笑「連天神都不懂」，因為他知道——不懂就要問，才有機會明白。", "act": "如果心裡有疑問，不要憋著——找懂的人問，或在心裡默問佛菩薩。答案，常常會在你誠心問了之後出現。", "next_n": 5, "next_title": "佛揭曉地藏將至", "nt1": "佛揭曉|地藏將至", "nt2": "", "next_blurb": "佛陀對無垢生說：「你們都要知道，有一位菩薩，名字叫地藏，他在無量大劫前就成熟有情……」", "series_next": "", "dir": "img/004/", "images": ["img/004/p01.webp", "img/004/p02.webp", "img/004/p03.webp", "img/004/p04.webp", "img/004/p05.webp", "img/004/p06.webp", "img/004/p07.webp", "img/004/p08.webp", "img/004/p09.webp", "img/004/p10.webp", "img/004/p11.webp"], "next_dir": "img/005/", "next_img": "img/005/p01.webp"}, {"n": 5, "title": "佛揭曉地藏將至", "t1": "佛揭曉|地藏將至", "t2": "", "sutra": "爾時，世尊告無垢生天帝釋曰：汝等當知，有菩薩摩訶薩，名曰地藏，已於無量無數大劫，五濁惡時，無佛世界，成熟有情。", "quote": "最偉大的人，往往在最沒有人看見的地方做事。", "q": ["最偉大的人，往往在", "最沒有人看見的地方做事。"], "by": "聖嚴法師", "think": "地藏菩薩，不是只在有佛陀的時候才出現。他選擇的，都是「最難的地方」、「最苦的時代」、「最沒人去的角落」。", "act": "想想看，我們身邊有沒有人，默默地在做一些別人不想做的事？那，就是地藏菩薩的影子。看見了，就跟他說一聲謝謝。", "next_n": 6, "next_title": "佛讚地藏之一 · 伏藏明珠", "nt1": "佛讚地藏|之一", "nt2": "伏藏明珠", "next_blurb": "佛陀說：「這位大菩薩，是諸多微妙功德的伏藏，是諸解脫珍寶出處……」", "series_next": "", "dir": "img/005/", "images": ["img/005/p01.webp", "img/005/p02.webp", "img/005/p03.webp", "img/005/p04.webp", "img/005/p05.webp", "img/005/p06.webp", "img/005/p07.webp", "img/005/p08.webp", "img/005/p09.webp", "img/005/p10.webp", "img/005/p11.webp"], "next_dir": "img/006/", "next_img": "img/006/p01.webp"}, {"n": 6, "title": "佛讚地藏之一 · 伏藏明珠", "t1": "佛讚地藏|之一", "t2": "伏藏明珠", "sutra": "是地藏菩薩摩訶薩，有無量無數不可思議殊勝功德之所莊嚴，一切世間聲聞、獨覺所不能測。", "quote": "真正的寶藏，不是金銀珠寶，是一顆願意給別人的心。", "q": ["真正的寶藏，不是金銀珠寶，", "是一顆願意給別人的心。"], "by": "聖嚴法師", "think": "地藏菩薩的「伏藏」，不是埋在山裡的金子，是埋在他心裡的願力。他願意一直給、一直給，永遠不嫌累。", "act": "試著做一個小小的「伏藏」：默默幫一個人，不要讓他知道是你。那一刻，你就跟地藏菩薩一樣了。", "next_n": 7, "next_title": "佛讚地藏之二 · 喻如諸物", "nt1": "佛讚地藏|之二", "nt2": "喻如諸物", "next_blurb": "佛陀繼續說：地藏菩薩照行善者像太陽，照失道者像火炬，除煩惱熱像月清涼……", "series_next": "", "dir": "img/006/", "images": ["img/006/p01.webp", "img/006/p02.webp", "img/006/p03.webp", "img/006/p04.webp", "img/006/p05.webp", "img/006/p06.webp", "img/006/p07.webp", "img/006/p08.webp", "img/006/p09.webp", "img/006/p10.webp", "img/006/p11.webp"], "next_dir": "img/007/", "next_img": "img/007/p01.webp"}, {"n": 7, "title": "佛讚地藏之二 · 喻如諸物", "t1": "佛讚地藏|之二", "t2": "喻如諸物", "sutra": "照行善者猶如朗日，照失道者猶如明炬，除煩惱熱如月清涼，如無足者所得車乘，如遠涉者所備資糧，如迷方者所逢示導……", "quote": "最深的慈悲，是讓人感覺不到壓力的陪伴。", "q": ["最深的慈悲，", "是讓人感覺不到壓力的陪伴。"], "by": "聖嚴法師", "think": "太陽、火炬、月亮、車子、糧食、嚮導——都不會自己跑來找你。但只要你願意，它們永遠在那裡。", "act": "想一想，你心裡有沒有一個「總是在那裡」的力量？那可能就是地藏菩薩，安靜地陪著你，沒有要求，只有溫暖。", "next_n": 8, "next_title": "地藏菩薩出場", "nt1": "地藏菩薩|出場", "nt2": "", "next_blurb": "終於到了這一刻——地藏菩薩以神通力，現聲聞像，從南方來，至佛前住……", "series_next": "", "dir": "img/007/", "images": ["img/007/p01.webp", "img/007/p02.webp", "img/007/p03.webp", "img/007/p04.webp", "img/007/p05.webp", "img/007/p06.webp", "img/007/p07.webp", "img/007/p08.webp", "img/007/p09.webp", "img/007/p10.webp", "img/007/p11.webp"], "next_dir": "img/008/", "next_img": "img/008/p01.webp"}, {"n": 8, "title": "地藏菩薩出場", "t1": "地藏菩薩|出場", "t2": "", "sutra": "世尊說是地藏菩薩諸功德已，爾時，地藏菩薩摩訶薩與八十百千那庾多頻跋羅菩薩，以神通力，現聲聞像，從南方來，至佛前住，與諸眷屬……", "quote": "真正有德的人，都不需要華麗的外表。", "q": ["真正有德的人，", "都不需要華麗的外表。"], "by": "聖嚴法師", "think": "地藏菩薩明明可以變成最華麗的造型，卻選擇現出家比丘像。因為他要告訴我們：修行人的莊嚴，不在衣服，在心。", "act": "看看身邊，那些安靜、樸素、默默做事的人——他們的「莊嚴」，比那些大聲喧嘩的人，更貼近地藏菩薩的樣子。", "next_n": 9, "next_title": "地藏禮讚佛偈 · 上", "nt1": "地藏|禮讚佛偈", "nt2": "（上）", "next_blurb": "地藏菩薩開始用詩歌讚嘆佛陀：「兩足尊導師，慈心常普覆，安忍如大地……」", "series_next": "", "dir": "img/008/", "images": ["img/008/p01.webp", "img/008/p02.webp", "img/008/p03.webp", "img/008/p04.webp", "img/008/p05.webp", "img/008/p06.webp", "img/008/p07.webp", "img/008/p08.webp", "img/008/p09.webp", "img/008/p10.webp", "img/008/p11.webp"], "next_dir": "img/009/", "next_img": "img/009/p01.webp"}, {"n": 9, "title": "地藏禮讚佛偈 · 上", "t1": "地藏|禮讚佛偈", "t2": "（上）", "sutra": "兩足尊導師，慈心常普覆，安忍如大地，遍除瞋忿心。具殊勝相好，莊嚴諸佛國，能以諦慈悲，充滿一切土。", "quote": "真正的讚嘆，不是說好聽話，是說真心話。", "q": ["真正的讚嘆，不是說好聽話，", "是說真心話。"], "by": "聖嚴法師", "think": "地藏菩薩的這段讚偈，一字一句都是真實——佛陀的慈悲，真的像天空；佛陀的忍耐，真的像大地。", "act": "試著對你愛的人說一句真心話——不要客套，不要敷衍。一句真心話，比一百句場面話，更有力量。", "next_n": 10, "next_title": "地藏禮讚佛偈 · 下", "nt1": "地藏|禮讚佛偈", "nt2": "（下）", "next_blurb": "地藏菩薩繼續說：「本願攝穢土，成熟惡眾生；起堅固正勤，久修諸苦行……」開始講自己的本願。", "series_next": "", "dir": "img/009/", "images": ["img/009/p01.webp", "img/009/p02.webp", "img/009/p03.webp", "img/009/p04.webp", "img/009/p05.webp", "img/009/p06.webp", "img/009/p07.webp", "img/009/p08.webp", "img/009/p09.webp", "img/009/p10.webp", "img/009/p11.webp"], "next_dir": "img/010/", "next_img": "img/010/p01.webp"}, {"n": 10, "title": "地藏禮讚佛偈 · 下", "t1": "地藏|禮讚佛偈", "t2": "（下）", "sutra": "本願攝穢土，成熟惡眾生。起堅固正勤，久修諸苦行。曾供事無量，佛菩薩聲聞，及濟諸有情，飢渴病死等。", "quote": "真正的願力，不是嘴巴說的，是身體做的。", "q": ["真正的願力，不是嘴巴說的，", "是身體做的。"], "by": "聖嚴法師", "think": "地藏菩薩沒有用華麗的句子，但每一句，都是他真實做過的事。無數生命、無數骨血、無數安樂——都給了眾生。", "act": "試著為一個人，做一件「捨自己一點點」的事。不用大，一點點就好。一點點，就是地藏菩薩的起點。", "next_n": 11, "next_title": "大眾供養地藏", "nt1": "大眾供養|地藏", "nt2": "", "next_blurb": "聽完地藏菩薩的禮讚佛偈，大眾感動萬分，紛紛把身上最好的香花、寶飾、衣服，都奉獻給地藏菩薩……", "series_next": "", "dir": "img/010/", "images": ["img/010/p01.webp", "img/010/p02.webp", "img/010/p03.webp", "img/010/p04.webp", "img/010/p05.webp", "img/010/p06.webp", "img/010/p07.webp", "img/010/p08.webp", "img/010/p09.webp", "img/010/p10.webp", "img/010/p11.webp"], "next_dir": "img/011/", "next_img": "img/011/p01.webp"}, {"n": 11, "title": "大眾供養地藏", "t1": "大眾供養|地藏", "t2": "", "sutra": "爾時，一切諸來大眾，既見地藏菩薩摩訶薩已，皆獲希奇，得未曾有，各持種種上妙香花、寶飾、衣服、幢幡蓋等，奉散地藏菩薩摩訶薩……", "quote": "供養，不是給菩薩添東西，是讓我們的心變柔軟。", "q": ["供養，不是給菩薩添東西，", "是讓我們的心變柔軟。"], "by": "聖嚴法師", "think": "大眾供養地藏菩薩，不是因為菩薩需要——菩薩什麼都不缺。是因為我們需要——需要透過奉獻，讓自己的心打開。", "act": "試著為一個人（家人、朋友、陌生人）做一個「小供養」：一杯水、一句問候、一個微笑。那一刻，你的心會變得柔軟、溫暖。", "next_n": 12, "next_title": "好疑問菩薩起問", "nt1": "好疑問菩薩|起問", "nt2": "", "next_blurb": "從大眾中，走出一位名叫「好疑問」的菩薩，他問佛陀：「世尊！這位善男子從何而來？所居佛國去此遠近？」", "series_next": "", "dir": "img/011/", "images": ["img/011/p01.webp", "img/011/p02.webp", "img/011/p03.webp", "img/011/p04.webp", "img/011/p05.webp", "img/011/p06.webp", "img/011/p07.webp", "img/011/p08.webp", "img/011/p09.webp", "img/011/p10.webp", "img/011/p11.webp"], "next_dir": "img/012/", "next_img": "img/012/p01.webp"}, {"n": 12, "title": "好疑問菩薩起問", "t1": "好疑問菩薩|起問", "t2": "", "sutra": "爾時，眾中有菩薩摩訶薩，名好疑問，從座而起，整理衣服，偏袒一肩，禮佛雙足，右膝著地，合掌向佛，而白佛言：世尊！此善男子從何而來？", "quote": "不會問問題的人，也不會找到答案。", "q": ["不會問問題的人，", "也不會找到答案。"], "by": "聖嚴法師", "think": "好疑問菩薩，就是因為「喜歡問」，才能幫整個大眾打開智慧的大門。如果他不問，大家心裡的問號，永遠是問號。", "act": "心裡有什麼疑問？不要憋著。找朋友問、找老師問、找佛菩薩問（在心裡默問也算）。問了，答案才會來。", "next_n": 13, "next_title": "地藏首楞伽摩三摩地", "nt1": "地藏|首楞伽摩|三摩地", "nt2": "", "next_blurb": "佛陀說：「這位大菩薩已經安住一種最深的禪定——首楞伽摩勝三摩地……」這是什麼樣的禪定？", "series_next": "", "dir": "img/012/", "images": ["img/012/p01.webp", "img/012/p02.webp", "img/012/p03.webp", "img/012/p04.webp", "img/012/p05.webp", "img/012/p06.webp", "img/012/p07.webp", "img/012/p08.webp", "img/012/p09.webp", "img/012/p10.webp", "img/012/p11.webp"], "next_dir": "img/013/", "next_img": "img/013/p01.webp"}, {"n": 13, "title": "地藏首楞伽摩三摩地", "t1": "地藏|首楞伽摩|三摩地", "t2": "", "sutra": "佛言：諦聽，善思念之！吾當為汝略說少分。如是大士，成就無量不可思議殊勝功德，已能安住首楞伽摩勝三摩地，善能悟入如來境界……", "quote": "真正的穩，不是不動——是不管怎麼動，都不會倒。", "q": ["真正的穩，不是不動——", "是不管怎麼動，都不會倒。"], "by": "聖嚴法師", "think": "首楞伽摩，是「勇士的禪定」——不是躲起來的禪定，是面對風雨還能站穩的禪定。我們不用一下就達到，但可以一點一點練。", "act": "練習一個小「健行」：當你遇到一件煩心的事，深呼吸三次，告訴自己「我穩住」。那一刻，你就在練地藏菩薩的禪定。", "next_n": 14, "next_title": "二十三種三摩地 · 上", "nt1": "二十三種|三摩地", "nt2": "（上）", "next_blurb": "佛陀說地藏菩薩還安住了 23 種特別的禪定，每一種都能利益不同的眾生。先講 8 種……", "series_next": "", "dir": "img/013/", "images": ["img/013/p01.webp", "img/013/p02.webp", "img/013/p03.webp", "img/013/p04.webp", "img/013/p05.webp", "img/013/p06.webp", "img/013/p07.webp", "img/013/p08.webp", "img/013/p09.webp", "img/013/p10.webp", "img/013/p11.webp"], "next_dir": "img/014/", "next_img": "img/014/p01.webp"}, {"n": 14, "title": "二十三種三摩地 · 上", "t1": "二十三種|三摩地", "t2": "（上）", "sutra": "如是大士，隨住如是諸佛國土，隨所安住諸三摩地，發起無量殊勝功德，成熟無量所化有情。", "quote": "真正的功夫，不是讓自己變好，是讓別人變好。", "q": ["真正的功夫，", "不是讓自己變好，", "是讓別人變好。"], "by": "聖嚴法師", "think": "地藏菩薩的禪定，不是自己關起來修——而是「我入定，你受益」。這才是大菩薩的禪定。", "act": "不一定要打坐才叫禪定。安靜地陪伴一個人 5 分鐘，不滑手機、不說話，就是禪定的開始。", "next_n": 15, "next_title": "二十三種三摩地 · 中", "nt1": "二十三種|三摩地", "nt2": "（中）", "next_blurb": "佛陀繼續講中間 8 種禪定——諸佛燈炬明定、金剛光定、電光明定……每一種都更厲害。", "series_next": "", "dir": "img/014/", "images": ["img/014/p01.webp", "img/014/p02.webp", "img/014/p03.webp", "img/014/p04.webp", "img/014/p05.webp", "img/014/p06.webp", "img/014/p07.webp", "img/014/p08.webp", "img/014/p09.webp", "img/014/p10.webp", "img/014/p11.webp"], "next_dir": "img/015/", "next_img": "img/015/p01.webp"}, {"n": 15, "title": "二十三種三摩地 · 中", "t1": "二十三種|三摩地", "t2": "（中）", "sutra": "隨住如是諸佛國土，若入諸佛燈炬明定，由此定力，令彼佛土一切有情，舍邪歸正歸依三寶。", "quote": "世界要變平，不是靠推土機，是靠每個人的心先平。", "q": ["世界要變平，不是靠推土機，", "是靠每個人的心先平。"], "by": "聖嚴法師", "think": "地藏菩薩的「金剛光定」，能讓山變平、毒刺消失。其實不是物理上的，是心裡的——當我們的心不再有「高低分別」、「敵我對立」，世界就會變平。", "act": "試著把心裡的一座小山推平：那個你看不順眼的人、那件你還記恨的事——放下一點點。心平了，世界就平了一點點。", "next_n": 16, "next_title": "二十三種三摩地 · 下", "nt1": "二十三種|三摩地", "nt2": "（下）", "next_blurb": "佛陀講最後 7 種禪定——能引勝踴躍定、世路光定、勝金剛定、增上觀勝幢定、慈悲聲定、引集諸福德定、海電光定……", "series_next": "", "dir": "img/015/", "images": ["img/015/p01.webp", "img/015/p02.webp", "img/015/p03.webp", "img/015/p04.webp", "img/015/p05.webp", "img/015/p06.webp", "img/015/p07.webp", "img/015/p08.webp", "img/015/p09.webp", "img/015/p10.webp", "img/015/p11.webp"], "next_dir": "img/016/", "next_img": "img/016/p01.webp"}, {"n": 16, "title": "二十三種三摩地 · 下", "t1": "二十三種|三摩地", "t2": "（下）", "sutra": "隨住如是諸佛國土，若入能引勝踴躍定，由此定力，令彼佛土一切有情，皆受無量勝妙歡喜。", "quote": "禪定不是離世，是入世更深。", "q": ["禪定不是離世，", "是入世更深。"], "by": "聖嚴法師", "think": "地藏菩薩的 23 種禪定，沒有一種是「自己關起來爽」——每一種都是「進入禪定，然後讓眾生受益」。", "act": "把你今天最安靜的 5 分鐘，獻給一個人。安靜地祝福他——願他平安、健康、快樂。那 5 分鐘，就是你的「小三摩地」。", "next_n": 17, "next_title": "尋聲救苦 · 基本生活", "nt1": "尋聲救苦", "nt2": "基本生活", "next_blurb": "佛陀說：任何眾生只要至心稱念、念誦、歸敬、供養地藏菩薩，都能得到所求——飢餓得飲食、缺衣得衣服……", "series_next": "", "dir": "img/016/", "images": ["img/016/p01.webp", "img/016/p02.webp", "img/016/p03.webp", "img/016/p04.webp", "img/016/p05.webp", "img/016/p06.webp", "img/016/p07.webp", "img/016/p08.webp", "img/016/p09.webp", "img/016/p10.webp", "img/016/p11.webp"], "next_dir": "img/017/", "next_img": "img/017/p01.webp"}, {"n": 17, "title": "尋聲救苦 · 基本生活", "t1": "尋聲救苦", "t2": "基本生活", "sutra": "隨所在處，若諸有情，種種希求憂苦逼切，有能至心稱名、念誦、歸敬、供養地藏菩薩摩訶薩者，一切皆得如法所求，離諸憂苦，隨其所應……", "quote": "呼喚菩薩，不是求菩薩來找你——是讓你的心，走向菩薩。", "q": ["呼喚菩薩，不是求菩薩來找你——", "是讓你的心，走向菩薩。"], "by": "聖嚴法師", "think": "我們念他的名字，是讓自己的心，安住在「有人在守護我」的感覺裡。那份感覺，就是救苦的開始。", "act": "安靜地，在心裡念三聲「南無大願地藏王菩薩」。感受一下，心會慢慢安靜下來。那，就是地藏菩薩的回應。", "next_n": 18, "next_title": "尋聲救苦 · 危難救拔", "nt1": "尋聲救苦", "nt2": "危難救拔", "next_blurb": "佛陀繼續說——被火燒、被水淹、被風吹、從山崖墜落、被毒蛇咬……只要至心呼喚地藏菩薩，都能脫離危難。", "series_next": "", "dir": "img/017/", "images": ["img/017/p01.webp", "img/017/p02.webp", "img/017/p03.webp", "img/017/p04.webp", "img/017/p05.webp", "img/017/p06.webp", "img/017/p07.webp", "img/017/p08.webp", "img/017/p09.webp", "img/017/p10.webp", "img/017/p11.webp"], "next_dir": "img/018/", "next_img": "img/018/p01.webp"}, {"n": 18, "title": "尋聲救苦 · 危難救拔", "t1": "尋聲救苦", "t2": "危難救拔", "sutra": "隨所在處，若諸有情，為火所焚，為水所溺，為風所飄，或於山巖崖岸，樹舍顛墜墮落，其心周惶，有能至心稱名、念誦、歸敬……", "quote": "在最害怕的時候，還能想起菩薩名字，那就是修行的成績。", "q": ["在最害怕的時候，", "還能想起菩薩名字，", "那就是修行的成績。"], "by": "聖嚴法師", "think": "平常念熟了，緊急時才會自然冒出來。如果平常不念，真的遇到災難，心一慌，名字就忘了。", "act": "養成一個小習慣：每天早上一睜眼，默念三聲「南無大願地藏王菩薩」；晚上睡前，再念三聲。", "next_n": 19, "next_title": "地藏現種種身度有情", "nt1": "地藏現種種身|度有情", "nt2": "", "next_blurb": "佛陀說：地藏菩薩會現大梵王身、自在天身、佛身、菩薩身，甚至動物身、地獄卒身，度化所有眾生……", "series_next": "", "dir": "img/018/", "images": ["img/018/p01.webp", "img/018/p02.webp", "img/018/p03.webp", "img/018/p04.webp", "img/018/p05.webp", "img/018/p06.webp", "img/018/p07.webp", "img/018/p08.webp", "img/018/p09.webp", "img/018/p10.webp", "img/018/p11.webp"], "next_dir": "img/019/", "next_img": "img/019/p01.webp"}, {"n": 19, "title": "地藏現種種身度有情", "t1": "地藏現種種身|度有情", "t2": "", "sutra": "為欲成熟諸有情故，於十方界，或時現作大梵王身，為諸有情如應說法。或復現作大自在天身、或作欲界他化自在天身……", "quote": "願意變成跟對方一樣的人，才能真正幫到對方。", "q": ["願意變成跟對方一樣的人，", "才能真正幫到對方。"], "by": "聖嚴法師", "think": "地藏菩薩變成國王、商人、農夫、動物、甚至地獄獄卒——不是要表演，是要「跟對方平等」，才能傳遞慈悲。", "act": "對你身邊的人，試著「站在他的位置」想一想：他在乎什麼？他怕什麼？他需要什麼？", "next_n": 20, "next_title": "大記明咒 + 序品終", "nt1": "大記明咒", "nt2": "序品終", "next_blurb": "地藏菩薩親自宣說「具足水火吉祥光明大記明咒」，然後序品第一就結束了！", "series_next": "", "dir": "img/019/", "images": ["img/019/p01.webp", "img/019/p02.webp", "img/019/p03.webp", "img/019/p04.webp", "img/019/p05.webp", "img/019/p06.webp", "img/019/p07.webp", "img/019/p08.webp", "img/019/p09.webp", "img/019/p10.webp", "img/019/p11.webp"], "next_dir": "img/020/", "next_img": "img/020/p01.webp"}, {"n": 20, "title": "大記明咒 + 序品終", "t1": "大記明咒", "t2": "序品終", "sutra": "爾時，地藏菩薩摩訶薩即從座起，而白佛言：大德世尊！我當濟度此四洲渚世尊弟子，一切苾芻及苾芻尼、鄔波索迦、鄔波斯迦……", "quote": "咒語不是迷信——是一種把心收攝的工具。", "q": ["咒語不是迷信——", "是一種把心收攝的工具。"], "by": "聖嚴法師", "think": "咒語念久了，心會自然安定下來。那份安定，就是一切「增長」的開始——記憶、健康、智慧，都從安定來。", "act": "試著靜靜念三聲「南無大願地藏王菩薩摩訶薩」。你會發現，心慢慢安住了下來。", "next_n": 21, "next_title": "地藏自起白佛 · 進入十輪品", "nt1": "地藏|自起白佛", "nt2": "進入|十輪品", "next_blurb": "地藏菩薩自己起身，用詩偈問佛陀：「我曾十三劫，已勤修苦行，為一切有情……云何轉佛輪？」十輪品第二開始！", "series_next": "", "dir": "img/020/", "images": ["img/020/p01.webp", "img/020/p02.webp", "img/020/p03.webp", "img/020/p04.webp", "img/020/p05.webp", "img/020/p06.webp", "img/020/p07.webp", "img/020/p08.webp", "img/020/p09.webp", "img/020/p10.webp", "img/020/p11.webp"], "next_dir": "img/021/", "next_img": "img/021/p01.webp", "go": {"no": 2, "cn": "二", "name": "十輪品", "n": 21}}]};</script>
